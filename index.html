.holo.active{transition-duration:.06s;animation:none}
.holo.releasing{transition-duration:.9s;animation:none}
#app.motion .holo:not(.active){animation:none;transition:none}
@keyframes holo-idle{0%,100%{--pointer-x:50%;--pointer-y:50%;--background-x:50%;--background-y:50%;--pointer-from-center:0;--pointer-from-top:.5;--pointer-from-left:.5;--card-opacity:0}
  30%{--pointer-x:26%;--pointer-y:28%;--background-x:44%;--background-y:42%;--pointer-from-center:.65;--pointer-from-top:.28;--pointer-from-left:.26;--card-opacity:.22}
  65%{--pointer-x:74%;--pointer-y:68%;--background-x:57%;--background-y:59%;--pointer-from-center:.6;--pointer-from-top:.68;--pointer-from-left:.74;--card-opacity:.22}}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
#app{position:relative;min-height:100%;padding-block:8px 20px;padding-inline:12px;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#app.shake{animation:screenshake .55s cubic-bezier(.36,.07,.19,.97) both}
@keyframes screenshake{10%,90%{transform:translate3d(-2px,1px,0)}20%,80%{transform:translate3d(4px,-2px,0)}30%,50%,70%{transform:translate3d(-8px,3px,0)}40%,60%{transform:translate3d(8px,-3px,0)}}

/* ===== DQ 視窗 ===== */
.win{position:relative;background:var(--win);border:3px solid var(--line);border-radius:7px;padding:8px 12px;color:var(--text)}
.win::before{content:"";position:absolute;inset:2px;border:1px solid var(--line);border-radius:4px;pointer-events:none;opacity:.9}
.win.tight{padding:6px 10px}
.win h3{margin:0 0 4px;font-size:13px;color:var(--yellow);font-weight:400;letter-spacing:.1em}
.cur::before{content:"▶";display:inline-block;width:1.1em;color:var(--text)}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{text-align:left;padding:2px 6px;display:flex;gap:4px;align-items:center;border-radius:3px}
.menu button::before{content:"▶";width:1.1em;flex:none;visibility:hidden}
.menu button:hover::before,.menu button.on::before,.menu button:focus-visible::before{visibility:visible}
.menu button.on{color:var(--yellow)}
.menu button:disabled{opacity:.4;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:3px solid var(--line);border-radius:7px;background:#000}
.btn::before{content:"▶";visibility:hidden}
.btn:hover::before,.btn:focus-visible::before{visibility:visible}
.btn.primary{color:var(--yellow)}
.pill{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill b{color:var(--yellow);font-weight:400}
select{background:#000;border:2px solid var(--line);border-radius:4px;padding:3px 6px;font-size:13px}
input[type=range]{accent-color:var(--yellow);width:70px}

/* ===== HUD ===== */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px}
.hud .title{color:var(--yellow);letter-spacing:.2em;font-size:15px}
.hz-track{display:inline-flex;gap:4px}
.hz{position:relative;opacity:.3;filter:grayscale(1);font-size:15px;line-height:1}
.hz[data-n="1"]{opacity:1;filter:none;animation:blink 1.2s steps(2,start) infinite}
.hz[data-n="2"]{opacity:1;filter:none}
.hz[data-removed]::after{content:"×";position:absolute;right:-4px;top:-6px;font-size:10px;color:var(--red)}
.hz .cnt{position:absolute;left:-2px;bottom:-6px;font-size:9px;color:var(--yellow)}
.hz[data-n="0"] .cnt{display:none}
.bgm{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px}
.bgm .ib{padding:1px 6px;border:2px solid var(--line);border-radius:4px;line-height:1.3}
.bgm .ib.on{color:var(--green);border-color:var(--green)}
.bgm select{max-width:130px;padding:1px 4px;font-size:12px}
.bgm .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;width:14px}
.bgm .eq i{width:2px;background:var(--yellow);height:30%}
.bgm.playing .eq i{animation:eq .8s steps(3) infinite}
.bgm.playing .eq i:nth-child(2){animation-delay:.2s}.bgm.playing .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}

/* ===== 場景 ===== */
.scene{position:relative;width:100%;aspect-ratio:16/8.6;max-height:470px;border:3px solid var(--line);border-radius:7px;overflow:hidden;background:#05070a;image-rendering:pixelated}
.scene::before{content:"";position:absolute;inset:2px;border:1px solid var(--line);border-radius:4px;pointer-events:none;z-index:9;opacity:.9}
.scene svg.cave{position:absolute;inset:0;width:100%;height:100%;shape-rendering:crispEdges}
.scene.turn svg.cave{animation:turnaround 1.3s ease-in-out both}
@keyframes turnaround{0%{transform:translateX(0)}40%{transform:translateX(38%) scale(1.08)}60%{transform:translateX(38%) scale(1.08)}100%{transform:translateX(0)}}
.scene.turn #current-card,.scene.turn #sprites{animation:fadeout 1.3s ease-in-out both}
@keyframes fadeout{0%{opacity:1}30%{opacity:0}70%{opacity:0}100%{opacity:1}}
.scene .vig{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,transparent 55%,rgba(0,0,0,.75));opacity:.85}
.scene .flame{transform-origin:50% 100%;animation:flame .35s steps(2) infinite alternate}
@keyframes flame{to{transform:scaleY(1.25) scaleX(.85)}}
.scene .glow{animation:glow 1.1s steps(3) infinite alternate;mix-blend-mode:screen}
@keyframes glow{from{opacity:.08}to{opacity:.18}}
.sprite{position:absolute;width:48px;height:64px;translate:-50% -100%;z-index:4;transition:filter .3s}
.sprite canvas{width:48px;height:64px;image-rendering:pixelated;display:block}
.sprite .tag{position:absolute;left:50%;top:-14px;translate:-50% 0;font-size:11px;color:var(--pc);white-space:nowrap;text-shadow:1px 1px 0 #000}
.sprite.face-left canvas{transform:scaleX(-1)}
.sprite.walk canvas{animation:bob .24s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.sprite.walk.face-left canvas{animation:bobL .24s steps(2) infinite}
@keyframes bobL{50%{transform:scaleX(-1) translateY(-3px)}}
.sprite.down canvas{transform:rotate(90deg) translate(6px,-4px);filter:grayscale(.8) brightness(.6)}
.sprite.thinking .tag{animation:blink 1s steps(2,start) infinite}
.sprite .bubble{position:absolute;left:50%;top:-38px;translate:-50% 0;background:#000;border:2px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px;white-space:nowrap;transform:scale(0);transition:transform .3s cubic-bezier(.2,1.6,.4,1);z-index:5}
.sprite .bubble.show{transform:scale(1)}
.sprite .bubble.go{color:var(--green)}.sprite .bubble.leave{color:var(--cyan)}
#current-card{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:3}
#current-card:empty::after{content:"";position:absolute}
.altar-hint{position:absolute;left:50%;top:50%;translate:-50% -50%;color:var(--dim);font-size:12px;z-index:2;text-align:center;line-height:1.3}
.cmd{position:absolute;left:10px;top:10px;z-index:10;min-width:150px}
.cmd .who{color:var(--pc,var(--yellow));font-size:13px;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.cmd .menu button{font-size:15px;padding:3px 6px}
.cmd .hint{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.3}
.cmd .hint b{color:var(--yellow);font-weight:400}
.cavetag{position:absolute;right:10px;top:10px;z-index:10;font-size:12px;padding:3px 8px}
.bustfx{position:absolute;inset:0;z-index:8;display:none;pointer-events:none}
.bustfx.on{display:block}
.bustfx .flash{position:absolute;inset:0;background:#e11;animation:redflash .16s steps(2) 8}
@keyframes redflash{50%{opacity:0}}
.bustfx .big{position:absolute;left:50%;top:44%;translate:-50% -50%;font-size:min(30vw,150px);line-height:1;filter:drop-shadow(4px 4px 0 #000)}
.bustfx.rock .big{animation:rockfall .9s cubic-bezier(.5,0,.8,.3) both}
@keyframes rockfall{0%{translate:-50% -300%}60%{translate:-50% -50%}72%{translate:-50% -70%}84%{translate:-50% -50%}100%{translate:-50% -50%}}
.bustfx.snake .big{animation:snake .8s steps(8) both}
@keyframes snake{0%{translate:-260% -50%}100%{translate:-50% -50%}}
.bustfx.spider .big{animation:spider .9s cubic-bezier(.3,1.4,.4,1) both}
@keyframes spider{0%{translate:-50% -300%}100%{translate:-50% -50%}}
.bustfx.mummy .big{animation:mummy 1s steps(6) both}
@keyframes mummy{0%{translate:-50% 150%}100%{translate:-50% -50%}}
.bustfx.fire .big{animation:fire .8s steps(5) both}
@keyframes fire{0%{scale:0}70%{scale:1.4}100%{scale:1}}
.toast{position:absolute;left:50%;top:38%;translate:-50% -50%;z-index:11;padding:10px 26px;font-size:clamp(16px,3.4vw,26px);letter-spacing:.25em;color:var(--yellow);animation:toast 2.2s steps(12) both;text-align:center;white-space:nowrap}
.toast small{display:block;font-size:.5em;letter-spacing:.3em;color:var(--dim)}
@keyframes toast{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* ===== 路徑窗 ===== */
.pathwin{display:flex;gap:10px;align-items:center;padding:6px 10px}
.pathwin .lbl{font-size:12px;color:var(--dim);white-space:nowrap;line-height:1.3}
.pathwin .lbl b{display:block;color:var(--yellow);font-weight:400;font-size:15px}
.path{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;--card-w:44px;--card-h:63px;min-height:78px;flex:1;scrollbar-width:thin}
.path-empty{color:var(--dim);font-size:12px;align-self:center}
.left-badge{position:absolute;right:-6px;top:-7px;z-index:3;min-width:18px;height:18px;border-radius:50%;background:var(--gold);color:#000;font-size:11px;display:grid;place-items:center;border:2px solid #000;transition:.3s}
#app.hl-path .left-badge{animation:blink .5s steps(2,start) infinite;background:var(--cyan)}

/* ===== 隊員窗 ===== */
.party{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.party{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pw{--pc:#fff;padding:6px 10px 8px;font-size:14px;transition:.3s}
.pw .nm{color:var(--pc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.pw .row{display:flex;justify-content:space-between;gap:6px;line-height:1.35}
.pw .row span:first-child{color:var(--dim)}
.pw .row b{font-weight:400;color:var(--text);font-variant-numeric:tabular-nums}
.pw .row b.gem{color:var(--gold)}
.pw .st{font-size:12px;color:var(--green);margin-top:2px}
.pw[data-status="out"]{color:var(--dim)}
.pw[data-status="out"] .st{color:var(--cyan)}
.pw[data-status="bust"] .st{color:var(--red)}
.pw[data-status="bust"] .nm{color:var(--red)}
.pw.thinking .st{color:var(--yellow);animation:blink 1s steps(2,start) infinite}
.pw.bounce{animation:winbounce .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes winbounce{35%{transform:translateY(-10px)}}
.pw .lost{animation:blink .2s steps(2) 5;color:var(--red)}

/* ===== 訊息窗 ===== */
.msgwin{min-height:96px;padding:8px 14px 10px;font-size:15px;line-height:1.5}
.msgwin .lines{display:flex;flex-direction:column;gap:1px;min-height:68px;justify-content:flex-end}
.msgwin .lines p{margin:0;white-space:pre-wrap;word-break:break-all}
.msgwin .lines p.old{color:var(--dim)}
.msgwin .lines p b{color:var(--yellow);font-weight:400}
.msgwin .lines p i{color:var(--gold);font-style:normal}
.msgwin .lines p u{color:var(--red);text-decoration:none}
.msgwin .lines p s{color:var(--cyan);text-decoration:none}
.msgwin .tri{position:absolute;right:12px;bottom:4px;color:var(--text);font-size:12px}
.msgwin .logbtn{position:absolute;right:12px;top:6px;font-size:11px;color:var(--dim);border:1px solid var(--dim);border-radius:3px;padding:0 5px}
.logwin{max-height:200px;overflow:auto;font-size:13px;scrollbar-width:thin}
.logwin p{margin:0;padding:2px 0;border-bottom:1px dotted #444}
.lockmsg{color:var(--dim);font-size:13px}

/* ===== 覆蓋層 ===== */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:#000;overflow:auto}
.overlay[hidden]{display:none!important}
.dlg{width:min(640px,100%);padding:14px 18px 16px}
.dlg h2{margin:0 0 6px;font-size:22px;color:var(--yellow);font-weight:400;letter-spacing:.2em}
.dlg .sub{color:var(--dim);font-size:13px;margin-bottom:10px}
.sec{margin:12px 0 4px;font-size:12px;color:var(--yellow);letter-spacing:.2em}
.lv-row{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;padding:4px 0;border-bottom:1px dotted #444}
.lv-row .nm{color:var(--pc);white-space:nowrap}
.lv-row .lv-desc{grid-column:1/3;font-size:12px;color:var(--dim);line-height:1.3}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px;font-size:13px}
.stat{display:flex;justify-content:space-between;border-bottom:1px dotted #444;padding:2px 0}
.stat b{color:var(--yellow);font-weight:400}
.rank{display:flex;flex-direction:column;gap:2px}
.rank .r{display:grid;grid-template-columns:1.2em 1fr auto auto;gap:10px;align-items:center;padding:3px 4px;border-bottom:1px dotted #444;--pc:#fff}
.rank .r .nm{color:var(--pc)}
.rank .r .nm small{color:var(--dim);font-size:11px;margin-left:6px}
.rank .r .sc{color:var(--gold);min-width:3em;text-align:right}
.rank .r .d{font-size:13px;min-width:5em;text-align:right}
.rank .r .d.plus{color:var(--green)}.rank .r .d.minus{color:var(--red)}
.rank .r.win{color:var(--yellow)}
.title-art{text-align:center;padding:6px 0 10px}
.title-art .big{font-size:clamp(34px,8vw,64px);letter-spacing:.3em;color:var(--yellow);text-shadow:3px 3px 0 #6b4a10;line-height:1.1}
.title-art .en{font-size:13px;letter-spacing:.5em;color:var(--dim);margin-top:4px}
.title-art .gem{width:56px;margin:0 auto 6px;display:block;animation:bob 1.2s steps(2) infinite}
#handoff .dlg{text-align:center}
#handoff .big{font-size:40px;margin:6px 0;animation:swap 1.4s steps(4) infinite}
@keyframes swap{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.fx{position:fixed;z-index:70;pointer-events:none;left:0;top:0;will-change:transform,opacity}
.frag{width:8px;height:8px;background:var(--gold);box-shadow:2px 2px 0 #000}
.coin{width:10px;height:10px;background:var(--gold);border:2px solid #6b4a10}
.chip{padding:0 6px;background:#000;border:2px solid var(--gold);color:var(--gold);font-size:13px;white-space:nowrap}
.credit{margin-top:10px;font-size:11px;color:var(--dim);line-height:1.4}
@media (max-width:640px){.hud .title{width:100%}.scene{aspect-ratio:16/10}.sprite{width:36px;height:48px}.sprite canvas{width:36px;height:48px}:root{--card-w:124px;--card-h:177px}.cmd{min-width:120px}.cmd .menu button{font-size:14px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<body>
<div id="app">
  <header class="hud win tight">
    <span class="title">印加寶藏</span>
    <span class="pill">洞穴 <b id="ui-round">–</b>／5</span>
    <span class="pill">牌庫 <b id="ui-deck">–</b></span>
    <span class="pill">陷阱 <span class="hz-track" id="hz-track"></span></span>
    <div class="bgm" id="bgm">
      <button class="ib" id="bgm-toggle" title="播放 / 暫停背景音樂">♪ 播放</button>
      <span class="eq"><i></i><i></i><i></i></span>
      <select id="bgm-style" title="曲風">
        <option value="jungle">Sci-Fi Jungle</option>
        <option value="temple">Ancient Temple</option>
        <option value="lofi">Lofi Tribal</option>
      </select>
      <input type="range" id="bgm-vol" min="0" max="100" value="55" title="音量">
      <button class="ib" id="sfx-toggle" title="音效開關">效</button>
      <button class="ib" id="motion-toggle" title="開啟手機動作感應（陀螺儀）" hidden>📱</button>
    </div>
  </header>

  <main class="screen" style="display:flex;flex-direction:column;gap:8px">
    <section class="scene" id="scene">

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V'];

const HAZARDS = {
  snake: { name: '毒蛇', icon: '🐍', bust: '毒蛇咬擊！' },
  spider: { name: '毒蜘蛛', icon: '🕷️', bust: '蛛網纏身！' },
  mummy: { name: '木乃伊', icon: '🧟', bust: '木乃伊甦醒！' },
  fire: { name: '烈焰', icon: '🔥', bust: '烈焰吞噬！' },
  rock: { name: '落石', icon: '🪨', bust: '巨石滾落！' },
};
const HZ_KEYS = Object.keys(HAZARDS);
const TREASURES = [1, 2, 3, 4, 5, 5, 7, 7, 9, 11, 11, 13, 14, 15, 17];
const LEVELS = {
  1: { n: '極度膽小', en: 'Timid', d: '看到任何 1 張陷阱、或本輪手上 ≥5 顆就撤退。' },
  2: { n: '穩健新手', en: 'Cautious', d: '2 種不同陷阱出現、或洞穴裡只剩自己就撤退。' },
  3: { n: '理性標準', en: 'Rational', d: '下一張爆掉機率 >25%、或路上餘數夠誘人就撤退。' },
  4: { n: '激進專家', en: 'Aggressive', d: '有陷阱聽牌且已翻 ≥8 張才考慮撤退；愛獨吞大獎。' },
  5: { n: '印加主宰', en: 'Master', d: '精算剩餘大牌與陷阱比例，領先卡位、落後博弈、餘數多時單獨撈乾。' },
};
const AI_POOL = [
  { name: '狐狸', emoji: '🦊', color: 'var(--ai1)', pal: ['#ffa640', '#b86a12'] },
  { name: '貓頭鷹', emoji: '🦉', color: 'var(--ai2)', pal: ['#c084fc', '#6d3fb8'] },
  { name: '花豹', emoji: '🐆', color: 'var(--ai3)', pal: ['#fbbf24', '#a37a0c'] },
];
const STATS_KEY = 'incan-gold-stats-v1';
const T = REDUCED ? { flip: 200, afterFlip: 300, aiReveal: 500, chip: 500, gap: 200 } : { flip: 750, afterFlip: 700, aiReveal: 1000, chip: 1300, gap: 450 };

/* ================= AUDIO ================= */
const AudioEngine = (() => {
  let ctx, master, musicGain, sfxGain, noiseBuf;
  let style = 'jungle', playing = false, timer = null, step = 0, live = [], sfxOn = true;
  function init() {
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = 1; musicGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value = .9; sfxGain.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      return true;
    } catch (e) { return false; }
  }
  function tone({ f, f2, type = 'sine', dur = .3, g = .2, a = .01, r = .2, dest, lp, detune = 0, t }) {
    t = t ?? ctx.currentTime; dest = dest || musicGain;
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur); o.detune.value = detune;
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(g, t + a); gn.gain.setValueAtTime(g, t + Math.max(a, dur - r)); gn.gain.exponentialRampToValueAtTime(.0001, t + dur + .02);
    let node = o;
    if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp; o.connect(fl); node = fl; }
    node.connect(gn); gn.connect(dest); o.start(t); o.stop(t + dur + .05);
    return o;
  }
  function noise({ dur = .2, g = .1, type = 'bandpass', f = 1000, f2, q = 1, dest, t }) {
    t = t ?? ctx.currentTime; dest = dest || musicGain;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur); fl.Q.value = q;
    const gn = ctx.createGain(); gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl); fl.connect(gn); gn.connect(dest); s.start(t); s.stop(t + dur + .05);
  }
  function killLive() { live.forEach(n => { try { n.stop(); } catch (e) { } }); live = []; }
  const STYLES = {
    jungle: { bpm: 88, start() {
        const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
        const fl = ctx.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 320; fl.Q.value = .6;
        const gn = ctx.createGain(); gn.gain.value = .05;
        const lfo = ctx.createOscillator(); lfo.frequency.value = .08; const lg = ctx.createGain(); lg.gain.value = 180; lfo.connect(lg); lg.connect(fl.frequency);
        s.connect(fl); fl.connect(gn); gn.connect(musicGain); s.start(); lfo.start(); live.push(s, lfo);
      }, step(i, t) {
        const scale = [146.8, 174.6, 220, 261.6, 329.6, 392];
        if (i % 4 === 0) { const f = scale[Math.floor(Math.random() * scale.length)]; tone({ f, type: 'sine', dur: 2.4, g: .07, a: .4, r: 1.2, lp: 900, t }); tone({ f: f * 2, type: 'triangle', dur: 2.2, g: .03, a: .5, r: 1, lp: 1200, detune: 6, t }); }
        if (Math.random() < .2) tone({ f: rnd(1400, 2600), f2: rnd(1800, 3200), type: 'sine', dur: .12, g: .035, a: .01, r: .08, t });
        if (i % 8 === 0) tone({ f: 95, f2: 55, type: 'sine', dur: .28, g: .14, a: .005, r: .2, t });
        if (i % 8 === 5 && Math.random() < .6) tone({ f: 70, f2: 48, type: 'sine', dur: .22, g: .09, a: .005, r: .15, t });
      } },
    temple: { bpm: 74, start() {
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 55;
        const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 160; fl.Q.value = 4;
        const gn = ctx.createGain(); gn.gain.value = .09;
        const lfo = ctx.createOscillator(); lfo.frequency.value = .11; const lg = ctx.createGain(); lg.gain.value = 70; lfo.connect(lg); lg.connect(fl.frequency);
        o.connect(fl); fl.connect(gn); gn.connect(musicGain); o.start(); lfo.start(); live.push(o, lfo);
      }, step(i, t) {
        if (i % 8 === 0 || i % 8 === 4 || (i % 8 === 6 && Math.random() < .4)) tone({ f: 130, f2: 38, type: 'sine', dur: .38, g: .4, a: .003, r: .3, t });
        if (i % 8 === 3) tone({ f: 180, f2: 105, type: 'sine', dur: .25, g: .2, a: .003, r: .2, t });
        if (i % 2 === 1) noise({ dur: .05, g: .035, type: 'highpass', f: 6000, t });
        if (i % 32 === 16) { tone({ f: 82, type: 'sine', dur: 3, g: .12, a: .01, r: 2.5, t }); tone({ f: 123, type: 'sine', dur: 2.5, g: .06, a: .01, r: 2, t }); tone({ f: 246, type: 'triangle', dur: 2, g: .03, a: .01, r: 1.5, t }); }
      } },
    lofi: { bpm: 68, start() { }, step(i, t) {
        const prog = [[220, 261.6, 329.6, 392], [174.6, 220, 261.6, 329.6], [130.8, 164.8, 196, 246.9], [196, 246.9, 293.7, 349.2]];
        if (i % 8 === 0) prog[(i / 8) % 4].forEach((f, k) => tone({ f, type: 'triangle', dur: 3.4, g: .045, a: .3, r: 1.6, lp: 800, detune: k * 3, t }));
        if (i % 8 === 0 || i % 8 === 4) tone({ f: 100, f2: 50, type: 'sine', dur: .25, g: .16, a: .003, r: .2, t });
        if (i % 8 === 4) noise({ dur: .12, g: .07, type: 'bandpass', f: 1500, q: .8, t });
        if (i % 2 === 1) noise({ dur: .06, g: .03, type: 'bandpass', f: 5000, q: 1, t });
        if (Math.random() < .5) noise({ dur: .012, g: .02, type: 'highpass', f: 3000, t });
      } },
  };
  function loop() { const st = STYLES[style]; const stepSec = 60 / st.bpm / 2; st.step(step++, ctx.currentTime + .03); timer = setTimeout(loop, stepSec * 1000); }
  return {
    play() { if (!init()) return false; if (ctx.state === 'suspended') ctx.resume(); if (playing) return true; playing = true; step = 0; STYLES[style].start(); loop(); return true; },
    stop() { playing = false; clearTimeout(timer); killLive(); },
    toggle() { return playing ? (this.stop(), false) : this.play(); },
    setStyle(s) { style = s; if (playing) { this.stop(); this.play(); } },
    setVolume(v) { if (init()) master.gain.value = v; },
    setSfx(on) { sfxOn = on; },
    get playing() { return playing; },
    sfx(name) {
      if (!sfxOn || !init()) return; if (ctx.state === 'suspended') ctx.resume();
      const t = ctx.currentTime, d = sfxGain;
      switch (name) {
        case 'flip': noise({ dur: .2, g: .18, f: 900, f2: 2600, q: .7, dest: d, t }); break;
        case 'gem': tone({ f: 1046, type: 'square', dur: .1, g: .06, r: .06, dest: d, t }); tone({ f: 1568, type: 'square', dur: .16, g: .06, r: .1, dest: d, t: t + .08 }); break;
        case 'hazard': tone({ f: 220, f2: 110, type: 'sawtooth', dur: .4, g: .12, r: .3, lp: 600, dest: d, t }); noise({ dur: .3, g: .12, type: 'lowpass', f: 500, dest: d, t }); break;
        case 'lock': tone({ f: 660, type: 'square', dur: .06, g: .06, r: .04, dest: d, t }); tone({ f: 880, type: 'square', dur: .08, g: .06, r: .05, dest: d, t: t + .07 }); break;
        case 'cursor': tone({ f: 990, type: 'square', dur: .05, g: .05, r: .03, dest: d, t }); break;
        case 'reveal': [523, 659, 784].forEach((f, i) => tone({ f, type: 'square', dur: .12, g: .06, r: .08, dest: d, t: t + i * .07 })); break;
        case 'coin': for (let i = 0; i < 6; i++) tone({ f: rnd(1600, 2600), type: 'square', dur: .08, g: .05, r: .05, dest: d, t: t + i * .045 }); break;
        case 'bounce': tone({ f: 330, f2: 720, type: 'square', dur: .18, g: .08, r: .1, dest: d, t }); break;
        case 'step': tone({ f: 180, type: 'square', dur: .04, g: .04, r: .02, dest: d, t }); break;
        case 'shatter': noise({ dur: .35, g: .2, type: 'highpass', f: 2500, dest: d, t }); for (let i = 0; i < 8; i++) tone({ f: rnd(2000, 5000), type: 'square', dur: .07, g: .04, r: .05, dest: d, t: t + rnd(0, .3) }); break;
        case 'bust': noise({ dur: 1.2, g: .6, type: 'lowpass', f: 420, f2: 60, dest: d, t }); tone({ f: 60, f2: 28, type: 'sine', dur: 1.3, g: .5, a: .005, r: .9, dest: d, t }); tone({ f: 200, f2: 35, type: 'sawtooth', dur: .6, g: .18, r: .4, lp: 400, dest: d, t }); break;
        case 'win': [523, 659, 784, 1046, 1318].forEach((f, i) => tone({ f, type: 'square', dur: .3, g: .08, r: .2, dest: d, t: t + i * .12 })); break;
        case 'round': tone({ f: 392, type: 'square', dur: .3, g: .07, r: .2, dest: d, t }); tone({ f: 587, type: 'square', dur: .5, g: .07, r: .3, dest: d, t: t + .15 }); break;
        case 'type': tone({ f: 1200, type: 'square', dur: .02, g: .012, r: .01, dest: d, t }); break;
      }
    }
  };
})();

/* ================= STATS ================= */
const defStats = () => ({ games: 0, p1: 0, p2: 0, ai: 0, best: 0, busts: 0 });
function loadStats() { try { return Object.assign(defStats(), JSON.parse(localStorage.getItem(STATS_KEY) || '{}')); } catch (e) { return defStats(); } }
function saveStats(s) { try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch (e) { } }
function renderStats() {
  const s = loadStats();
  $('#stats').innerHTML = [['探險場數', s.games], ['P1 勝場', s.p1], ['P2 勝場', s.p2], ['AI 勝場', s.ai], ['單場最高', s.best], ['爆掉次數', s.busts]].map(([l, v]) => `<div class="stat"><span>${l}</span><b>${v}</b></div>`).join('');
}

/* ================= STATE ================= */
const G = { mode: 'solo', levels: [3, 3, 3], players: [], round: 0, deck: [], pathCards: [], shown: {}, removed: {}, phase: 'lobby', humanQueue: [], qi: 0 };
let cardId = 0;
function pathTotal() { return G.pathCards.reduce((s, c) => s + (c.left || 0), 0); }
function inCave() { return G.players.filter(p => p.inCave); }
function humans() { return G.players.filter(p => p.type === 'human'); }
function setupPlayers() {
  G.players = [{ id: 0, name: '探險家P1', short: 'P1', emoji: '🧢', color: 'var(--p1)', pal: ['#39ff14', '#1c8a0a'], type: 'human', tent: 0 }];
  if (G.mode === 'duo') G.players.push({ id: 1, name: '探險家P2', short: 'P2', emoji: '🎩', color: 'var(--p2)', pal: ['#ff3d9a', '#9c1a5a'], type: 'human', tent: 0 });
  const nAI = 4 - G.players.length;
  for (let i = 0; i < nAI; i++) { const a = AI_POOL[i]; G.players.push({ id: G.players.length, name: a.name, short: a.name, emoji: a.emoji, color: a.color, pal: a.pal, type: 'ai', slot: i, level: G.levels[i], tent: 0, bias: rnd(-.06, .06), gbias: Math.round(rnd(-1, 1)) }); }
  G.players.forEach(p => { p.round = 0; p.inCave = true; p.choice = null; p.gained = 0; p.lost = 0; p.status = 'cave'; });
}
function buildDeck() {
  const d = [];
  TREASURES.forEach(v => d.push({ id: ++cardId, kind: 'treasure', value: v, left: 0 }));
  HZ_KEYS.forEach(t => { const n = 3 - (G.removed[t] || 0); for (let i = 0; i < n; i++) d.push({ id: ++cardId, kind: 'hazard', type: t }); });
  return shuffle(d);

/* ================= HOLO TILT（pokemon-cards-css Card.svelte 的指標數學） ================= */
const HVARS = ['--pointer-x', '--pointer-y', '--background-x', '--background-y', '--rotate-x', '--rotate-y', '--pointer-from-center', '--pointer-from-top', '--pointer-from-left', '--card-opacity'];
const clamp = (v, a = 0, b = 100) => Math.min(b, Math.max(a, v));

  s.setProperty('--pointer-x', px.toFixed(2) + '%'); s.setProperty('--pointer-y', py.toFixed(2) + '%');

}
function holoGrab(el) { clearTimeout(releaseTimers.get(el)); el.classList.remove('releasing'); el.classList.add('active'); }
function holoRelease(el) { el.classList.remove('active'); el.classList.add('releasing'); HVARS.forEach(v => el.style.removeProperty(v)); releaseTimers.set(el, setTimeout(() => el.classList.remove('releasing'), 950)); }

  if (!el) return; if (activeHolo !== el) { activeHolo = el; holoGrab(el); } holoPoint(el, e.clientX, e.clientY);

document.addEventListener('pointerout', e => { if (activeHolo && !e.relatedTarget?.closest?.('.holo')) { holoRelease(activeHolo); activeHolo = null; } });

/* ===== 手機陀螺儀（pokemon-cards-css orientation 模式）：gamma/beta 相對基準 → 同一組變數設在 #app，所有卡一起動 ===== */
(() => {

    s.setProperty('--pointer-x', px.toFixed(2) + '%'); s.setProperty('--pointer-y', py.toFixed(2) + '%');
    s.setProperty('--background-x', adjust(dx, -LIM.x, LIM.x, 37, 63).toFixed(2) + '%'); s.setProperty('--background-y', adjust(dy, -LIM.y, LIM.y, 33, 67).toFixed(2) + '%');
    s.setProperty('--rotate-x', (-dx).toFixed(2) + 'deg'); s.setProperty('--rotate-y', dy.toFixed(2) + 'deg');
    s.setProperty('--pointer-from-center', clamp(Math.hypot(px - 50, py - 50) / 50, 0, 1).toFixed(3));
    s.setProperty('--pointer-from-top', (py / 100).toFixed(3)); s.setProperty('--pointer-from-left', (px / 100).toFixed(3)); s.setProperty('--card-opacity', '1');
  }
  function enable() { on = true; app.classList.add('motion'); btn.hidden = false; btn.classList.add('on'); btn.title = '動作感應中，點一下重設水平'; cancelAnimationFrame(raf); apply(); }

/* ================= FX ================= */
const center = el => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };

  const frames = mid ? [{ transform: `translate(${from.x}px,${from.y}px)` }, { transform: `translate(${mid.x}px,${mid.y}px)`, offset: .5 }, { transform: `translate(${to.x}px,${to.y}px)` }] : [{ transform: `translate(${from.x}px,${from.y}px)` }, { transform: `translate(${to.x}px,${to.y}px)` }];

}

  await wait(REDUCED ? 100 : 700);
  victims.forEach(p => { shatterAt($('#pl-' + p.id + ' .round-n')); p.lost = p.round; p.round = 0; p.inCave = false; p.status = 'bust'; });
  toast(`${HAZARDS[type].bust}<small>留在洞穴的寶石全數粉碎</small>`);
  await wait(500); renderPlayers();
  await log(`<u>${victims.map(p => `${p.name} 失去 ${p.lost} 顆`).join('，')}。</u>`);
  await wait(REDUCED ? 200 : 1000); b.className = 'bustfx'; app.classList.remove('shake');
  endRound(true);
}
function goDecision() {
  const ic = inCave(); if (!ic.length) return endRound(false);
  G.phase = 'decide'; G.players.forEach(p => { p.choice = null; });
  ic.filter(p => p.type === 'ai').forEach(p => { p.choice = aiDecide(p); $('#pl-' + p.id).classList.add('thinking'); $('#sp-' + p.id)?.classList.add('thinking'); });
  renderPlayers();
  G.humanQueue = ic.filter(p => p.type === 'human'); G.qi = 0;
  if (!G.humanQueue.length) { log('你已在營地。AI 們正在抉擇…'); setTimeout(revealChoices, T.aiReveal); return; }
  askHuman();
}
function askHuman() {
  const p = G.humanQueue[G.qi];
  if (G.mode === 'duo' && G.qi > 0) {
    const prev = G.humanQueue[G.qi - 1];
    $('#handoff-title').textContent = `${prev.short} 選擇完畢`; $('#handoff-sub').textContent = `請將裝置移交給 ${p.short} 進行秘密決策`; $('#handoff-ok').textContent = `我是 ${p.short}，開始決策`;
    $('#handoff').hidden = false; return;
  }
  showDecision(p);
}
let cmdIndex = 0;
function showDecision(p) {
  const d = $('#decision'); d.hidden = false;
  d.style.setProperty('--pc', p.color); $('#decision-who').textContent = `${p.emoji} ${p.name} 要怎麼做？`;
  d.dataset.pid = p.id; cmdIndex = 0; setCursor(0);
  $$('#cmd-menu button').forEach(b => b.disabled = false);
  log(`${p.name}，前進還是撤退？`);
}
function setCursor(i) {
  cmdIndex = i; $$('#cmd-menu button').forEach((b, k) => b.classList.toggle('on', k === i));
  const p = G.players[+$('#decision').dataset.pid]; if (!p) return;
  const pt = pathTotal(); const leave = i === 1; $('#app').classList.toggle('hl-path', leave);
  $('#cmd-hint').innerHTML = leave ? `撤退可帶回 <b>${p.round + pt}</b> 顆<br>（本輪 ${p.round} ＋ 路上 ${pt}）` : `↑↓ 選擇　Enter 決定`;
}
function hideDecision() { $('#decision').hidden = true; $('#app').classList.remove('hl-path'); }
function onChoice(choice) {
  if (G.phase !== 'decide') return; const p = G.players[+$('#decision').dataset.pid]; if (!p || p.choice) return;
  p.choice = choice; AudioEngine.sfx('lock'); hideDecision();
  G.qi++;
  if (G.qi < G.humanQueue.length) return askHuman();
  log('選擇已鎖定。所有人同時亮牌…');
  setTimeout(revealChoices, T.aiReveal);
}
async function revealChoices() {
  G.phase = 'resolve'; AudioEngine.sfx('reveal');
  G.players.forEach(p => { $('#pl-' + p.id).classList.remove('thinking'); $('#sp-' + p.id)?.classList.remove('thinking'); });
  const ic = inCave();
  ic.forEach(p => { if (p.type === 'ai') { const c = $('#sp-' + p.id + ' .bubble'); c.className = 'bubble ' + p.choice; c.textContent = p.choice === 'go' ? '前進！' : '撤退！'; void c.offsetWidth; c.classList.add('show'); } });
  const leavers = ic.filter(p => p.choice === 'leave'), stayers = ic.filter(p => p.choice === 'go');
  renderPlayers();
  ic.forEach(p => { const st = $('#pl-' + p.id + ' .st'); st.textContent = p.choice === 'go' ? '▶ 前進！' : '▶ 撤退！'; st.style.color = p.choice === 'go' ? 'var(--green)' : 'var(--cyan)'; });
  log(`亮牌：${ic.map(p => `${p.short}${p.choice === 'go' ? '<b>前進</b>' : '<s>撤退</s>'}`).join('　')}`);
  await wait(T.chip);
  $$('.bubble').forEach(c => c.classList.remove('show')); $$('.pw .st').forEach(st => st.style.color = '');
  if (leavers.length) {
    const pt = pathTotal(); const share = Math.floor(pt / leavers.length);
    let need = share * leavers.length;
    for (const c of G.pathCards) { if (need <= 0) break; if (c.kind !== 'treasure') continue; const take = Math.min(c.left, need); c.left -= take; need -= take; }
    for (const p of leavers) { p.gained = p.round + share; p.tent += p.gained; p.inCave = false; p.status = 'out'; log(`<s>${p.name} 撤退</s>，帶回 ${p.round} ＋ 路上 ${share} ＝ <i>${p.gained}</i> 顆。`); }
    for (let i = 0; i < leavers.length; i++) { const p = leavers[i]; p.round = 0; await animateRetreat(p, share); }
    renderPlayers(); renderPath(); renderTop();
  }
  if (!stayers.length) return endRound(false);
  await wait(T.gap); revealCard();
}
function finishCaveAll() { inCave().forEach(p => { p.gained = p.round; p.tent += p.round; p.round = 0; p.inCave = false; p.status = 'out'; }); renderPlayers(); endRound(false); }
function endRound(busted) {
  G.phase = 'roundEnd'; hideDecision(); renderPlayers(); renderTop();
  const last = G.round >= 5;
  const rows = [...G.players].sort((a, b) => b.tent - a.tent).map((p, i) => `<div class="r" style="--pc:${p.color}"><span>${i === 0 ? '▶' : ''}</span><span class="nm">${p.name}<small>${p.status === 'bust' ? '被陷阱埋葬' : p.gained > 0 ? '平安回營' : '空手回營'}</small></span>${p.status === 'bust' ? `<span class="d minus">−${p.lost}</span>` : `<span class="d plus">＋${p.gained}</span>`}<span class="sc">${p.tent}</span></div>`).join('');
  openModal(`<h2>${busted ? '洞穴崩塌' : '全員回營'}</h2><div class="sub">第 ${G.round} 座洞穴結算　（帳篷累計）</div><div class="rank">${rows}</div><div class="mt-4"><button class="btn primary" id="m-next">${last ? '看最終結果' : `進入第 ${ROMAN[G.round + 1]} 座洞穴`}</button></div>`);
  $('#m-next').onclick = () => { closeModal(); last ? gameOver() : nextRound(); };
}
function gameOver() {
  G.phase = 'gameOver'; const max = Math.max(...G.players.map(p => p.tent)); const winners = G.players.filter(p => p.tent === max);
  const s = loadStats(); s.games++; winners.forEach(w => { if (w.id === 0) s.p1++; else if (w.type === 'human') s.p2++; else s.ai++; });
  s.best = Math.max(s.best, ...humans().map(p => p.tent)); saveStats(s); renderStats();
  const humanWon = winners.some(w => w.type === 'human'); AudioEngine.sfx(humanWon ? 'win' : 'round');
  const rows = [...G.players].sort((a, b) => b.tent - a.tent).map(p => `<div class="r ${p.tent === max ? 'win' : ''}" style="--pc:${p.color}"><span>${p.tent === max ? '👑' : ''}</span><span class="nm">${p.name}<small>${p.type === 'human' ? '真人' : `AI Lv${p.level} ${LEVELS[p.level].n}`}</small></span><span></span><span class="sc">${p.tent}</span></div>`).join('');
  openModal(`<h2>${humanWon ? '寶藏歸你！' : '寶藏被 AI 帶走了'}</h2><div class="sub">${winners.map(w => w.name).join('、')} 以 ${max} 顆寶石獲勝${winners.length > 1 ? '（平手）' : ''}</div><div class="rank">${rows}</div><div class="mt-4 flex gap-3 flex-wrap"><button class="btn primary" id="m-again">再探一次</button><button class="btn" id="m-lobby">回標題</button></div>`);
  $('#m-again').onclick = () => { closeModal(); startGame(); };
  $('#m-lobby').onclick = () => { closeModal(); $('#lobby').hidden = false; };
}
function openModal(html) { $('#modal-body').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; }

/* ================= AI ================= */
function aiDecide(p) {
  const ic = inCave(), n = ic.length, deckN = G.deck.length || 1;
  const shownTypes = HZ_KEYS.filter(t => G.shown[t] > 0);
  const pBust = shownTypes.reduce((s, t) => s + Math.max(0, 3 - (G.removed[t] || 0) - G.shown[t]) / deckN, 0);
  const path = pathTotal(), revealed = G.pathCards.length;
  const bias = p.bias || 0, gb = p.gbias || 0;
  switch (p.level) {
    case 1: return (shownTypes.length >= 1 || p.round >= 5 + gb) ? 'leave' : 'go';
    case 2: return (shownTypes.length >= 2 || n < 2) ? 'leave' : 'go';
    case 3: { if (pBust > .25 + bias) return 'leave'; if (path >= 5 + gb && path >= p.round * .5) return 'leave'; return 'go'; }
    case 4: { if (n === 1) return pBust > .5 ? 'leave' : 'go'; return (shownTypes.length >= 1 && revealed >= 8 + gb) ? 'leave' : 'go'; }
    case 5: {
      const revealedVals = G.pathCards.filter(c => c.kind === 'treasure').map(c => c.value);
      const pool = [...TREASURES]; revealedVals.forEach(v => { const i = pool.indexOf(v); if (i >= 0) pool.splice(i, 1); });
      const tCount = pool.length, tSum = pool.reduce((a, b) => a + b, 0), big = pool.filter(v => v >= 11).length;
      const evCard = tCount ? (tCount / deckN) * (tSum / tCount) / n : 0;
      const risk = pBust * p.round;
      const others = G.players.filter(x => x !== p); const lead = p.tent - Math.max(...others.map(x => x.tent));
      const k = lead > 0 ? 1.5 : lead < 0 ? .65 : 1;
      if (path >= 3 && n >= 3 && path > evCard * 2.5 + bias * 10) return 'leave';
      if (lead > 0 && pBust > .18 + bias && p.round >= 3) return 'leave';
      if (lead < 0 && big >= 2 && pBust < .36 + bias) return 'go';
      if (n === 1 && pBust < .4) return 'go';
      return (evCard * (1 - pBust) - risk * k > 0) ? 'go' : 'leave';
    }
  }
  return 'go';
}

/* ================= LOBBY / UI WIRING ================= */
function renderLobby() {
  $$('#mode-seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === G.mode));
  const nAI = G.mode === 'duo' ? 2 : 3;
  $('#lv-rows').innerHTML = AI_POOL.slice(0, nAI).map((a, i) => `<div class="lv-row" style="--pc:${a.color}"><span class="nm">${a.emoji} ${a.name}</span><select data-i="${i}" id="lv-${i}">${[1, 2, 3, 4, 5].map(l => `<option value="${l}" ${G.levels[i] === l ? 'selected' : ''}>Lv${l} ${LEVELS[l].n}・${LEVELS[l].en}</option>`).join('')}</select><div class="lv-desc" id="lvd-${i}">${LEVELS[G.levels[i]].d}</div></div>`).join('');
  $$('#lv-rows select').forEach(s => s.onchange = () => { G.levels[+s.dataset.i] = +s.value; $('#lvd-' + s.dataset.i).textContent = LEVELS[+s.value].d; });
  renderStats();
}
$('#mode-seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; G.mode = b.dataset.mode; AudioEngine.sfx('cursor'); renderLobby(); });
$('#btn-start').onclick = () => { AudioEngine.sfx('lock'); startGame(); };
$('#btn-reset-stats').onclick = () => { saveStats(defStats()); renderStats(); };
$$('#cmd-menu button').forEach((b, i) => { b.onclick = () => onChoice(b.dataset.c); b.addEventListener('pointerenter', () => { if (cmdIndex !== i) { AudioEngine.sfx('cursor'); setCursor(i); } }); b.addEventListener('focus', () => setCursor(i)); });
$('#handoff-ok').onclick = () => { $('#handoff').hidden = true; showDecision(G.humanQueue[G.qi]); };
$('#log-toggle').onclick = () => { const l = $('#log'); l.hidden = !l.hidden; l.scrollTop = l.scrollHeight; };
document.addEventListener('keydown', e => {
  if ($('#decision').hidden || G.phase !== 'decide') return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); AudioEngine.sfx('cursor'); setCursor(cmdIndex === 0 ? 1 : 0); }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onChoice(cmdIndex === 0 ? 'go' : 'leave'); }
});

/* BGM controls */
const bgmBox = $('#bgm');
$('#bgm-toggle').onclick = () => { const on = AudioEngine.toggle(); bgmBox.classList.toggle('playing', on); $('#bgm-toggle').textContent = on ? '♪ 暫停' : '♪ 播放'; $('#bgm-toggle').classList.toggle('on', on); };
$('#bgm-style').onchange = e => AudioEngine.setStyle(e.target.value);
$('#bgm-vol').oninput = e => AudioEngine.setVolume(e.target.value / 100);
let sfxOn = true; $('#sfx-toggle').onclick = () => { sfxOn = !sfxOn; AudioEngine.setSfx(sfxOn); $('#sfx-toggle').style.opacity = sfxOn ? 1 : .4; };

/* initial state behind the title screen */
setupPlayers(); renderPlayers(); renderTop(); renderPath(); renderLobby();
})();
</script>
